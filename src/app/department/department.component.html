  <div class="row custom-field">
    <div class="row justify-content-end">
      <div class="col-md-4">
        <form action="" [formGroup]="searchForm">
          <mat-form-field appearance="outline" class="full-width slim-field mt-2">
            <mat-label>Search Here</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Enter text to filter"
              formControlName="searchString" style="color: black;">
          </mat-form-field>
        </form>
      </div>
    </div>
  </div>



  <div class="mat-elevation-z8">
    <div class="mat-table-wrapper">
    <table mat-table [dataSource]="dataSource" matSort>
      <!--- Note that these columns can be defined in any order.
                The actual rendered columns are set as a property on the row definition" -->
      <!-- Id Column -->
      <ng-container matColumnDef="deptCode">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Department Id </th>
        <td mat-cell *matCellDef="let element"> {{element.deptCode}} </td>
      </ng-container>

      <ng-container matColumnDef="serialNo">
        <th mat-header-cell *matHeaderCellDef> Serial No. </th>
        <td mat-cell *matCellDef="let row; let rowIndex = index"> {{ (paginator.pageIndex * paginator.pageSize) +
          (rowIndex + 1) }} </td>
      </ng-container>

      <ng-container matColumnDef="nameCode">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Demand Code </th>
        <td mat-cell *matCellDef="let element"> {{element.nameCode}} </td>
      </ng-container>
      <!-- name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Department Name </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>

      <!-- email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
        <td mat-cell *matCellDef="let element"> {{element.email}} </td>
      </ng-container>
      <!-- mobile Column -->
      <ng-container matColumnDef="mobile">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Phone Number </th>
        <td mat-cell *matCellDef="let element"> {{element.mobile}} </td>
      </ng-container>
      <!-- isactive Column -->
      <ng-container matColumnDef="isactive">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Active Status </th>
        <td mat-cell *matCellDef="let element">
          <mat-button-toggle-group appearance="legacy" class="toggle-status"
            [value]="element.isactive ? 'true' : 'false'" (change)="onToggleChange($event, element)"
            [hideSingleSelectionIndicator]="true">
            <mat-button-toggle *ngFor="let item of decisionTypeList" [value]="item.codeValueId" class="toggle-btn">
              {{ item.codeValueDesc }}
            </mat-button-toggle>
          </mat-button-toggle-group>
        </td>
      </ng-container>



      <!-- <ng-container matColumnDef="isactive">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Active Status </th>
        <td mat-cell *matCellDef="let element">

          <mat-button-toggle-group appearance="legacy" class="toggle-status" [value]="element.isactive?'true':'false'"
            (change)="onToggleChange($event,element)">
            <mat-button-toggle *ngFor="let item of decisionTypeList" [value]="item.codeValueId" class="toggle-btn">
              {{item.codeValueDesc}}
            </mat-button-toggle>
          </mat-button-toggle-group>
        </td> -->





        <!-- </ng-container> -->

        <!-- Action Column -->
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef style="align-content: center;"> Action </th>
          <!-- <td mat-cell *matCellDef="let element" class="action-link">

          <button mat-flat-button matTooltip="Click to View" (click)="viewDepartment(element)">
            <mat-icon color="primary">visibility</mat-icon>
          </button>
        </td> -->
          <td mat-cell *matCellDef="let element" class="action-link">
            <button mat-icon-button color="primary" class="view-btn" matTooltip="Click to View"
              (click)="viewDepartment(element)">
              <mat-icon>visibility</mat-icon>
            </button>
          </td>

        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
    <mat-paginator #paginator [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 20]" [showFirstLastButtons]="true"
      [length]="totalSize" [pageIndex]="currentPage" (page)="handlePage($event)">
    </mat-paginator>

  </div>
  <!-- </mat-dialog-content> -->
</div>
