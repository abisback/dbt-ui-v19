<mat-card class="scheme-details-card">
  <button mat-icon-button class="close-btn" [mat-dialog-close]="true" aria-label="Close">
    <mat-icon>close</mat-icon>
  </button>

  <div class="scheme-header">
    <mat-icon color="primary" class="header-icon">info</mat-icon>
    <h2>View Scheme Details</h2>
  </div>

  <mat-divider></mat-divider>
  <div class="details-section">

    <div class="detail-row">
      <span class="detail-label">Department Name:</span>
      <span class="detail-value">{{viewData?.name}}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Department Code:</span>
      <span class="detail-value">{{viewData?.deptCode}}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Demand Number:</span>
      <span class="detail-value">{{viewData?.name_Code}}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Mobile No:</span>
      <span class="detail-value">{{viewData?.mobile}}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Email:</span>
      <span class="detail-value">{{viewData?.email}}</span>
    </div>

  </div>
</mat-card>
