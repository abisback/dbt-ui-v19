<h2 mat-dialog-title>Entry Details Form</h2>
<mat-divider></mat-divider>
<br/>
<mat-dialog-content class="mat-typography">
    <form class="example-form"  [formGroup]="dbtDataForm" (ngSubmit)="onSubmit()">
    <div class="row">
        <div class="col-md-2">
            <mat-form-field  class="example-full-width"  appearance="outline">
                <mat-label>Select Scheme</mat-label>
                <mat-select #schemeCode formControlName="schemeCode" disableRipple >
                    <mat-option *ngFor="let item of schemeList" [value]="item.id">
                        {{item.schemeName}}
                    </mat-option>
                </mat-select>
                <mat-hint>Please select Scheme</mat-hint>
            </mat-form-field>
        </div>
    </div>
    <br/>
        <mat-divider></mat-divider>
        <br/>
        <button mat-raised-button type="submit" color="primary" >Search</button>    
        &nbsp;&nbsp;&nbsp;
        <br/>
        <br/>
     </form>


</mat-dialog-content>

<mat-dialog-content class="mat-typography">    
  
    <div  class="mat-elevation-z8" *ngIf="tableflag">
        <mat-divider></mat-divider>
      <table mat-table [dataSource]="dataSource" matSort>
        
        <ng-container matColumnDef="dbtid">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> DBT Id </th>
            <td mat-cell *matCellDef="let element"> {{element.dbtid}} </td>
          </ng-container>
          <ng-container matColumnDef="benid">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Benificiary Id</th>
            <td mat-cell *matCellDef="let element"> {{element.benid}} </td>
          </ng-container>
        <!-- name Column -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Name</th>
            <td mat-cell *matCellDef="let element"> {{element.name}} </td>
        </ng-container>
        
        <!-- email Column -->
        <ng-container matColumnDef="age">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Age</th>
            <td mat-cell *matCellDef="let element"> {{element.age}} </td>
        </ng-container>
    <!-- mobile Column -->
    <ng-container matColumnDef="is_aadhar_validated">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Aadhar validate Status</th>
        <td mat-cell *matCellDef="let element"> {{element.is_aadhar_validated}}</td>
      </ng-container>
      <ng-container matColumnDef="aadharvalidatedate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Aadhar validate date</th>
          <td mat-cell *matCellDef="let element"> {{element.aadharvalidatedate}}</td>
        </ng-container>
     


        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr> 
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
  
      <mat-paginator #paginator [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 20]" [showFirstLastButtons]="true" [length]="totalSize"
        [pageIndex]="currentPage" (page)="handlePage($event)">
      </mat-paginator>
  
    </div>
  </mat-dialog-content>
