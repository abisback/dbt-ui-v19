<div class="body">
  <div class="container-fluid justify-content-end d-flex">
    <button
      class="btn custom-primary-btn d-flex align-items-center"
      mat-raised-button
      color="primary"
      mat-button
      (click)="openAddDialog()"
    >
      <mat-icon>edit</mat-icon>
      Compose
    </button>
  </div>

  <div class="container-fluid p-3">
    <div class="row">
      <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
        <div class="mat-elevation-z8 table-responsive-wrapper">
          <div class="table-responsive">
            <table
              mat-table
              [dataSource]="dataSource"
              matSort
              class="mat-table"
            >
              <!-- SERIAL NUMBER -->
              <ng-container matColumnDef="serial">
                <th mat-header-cell *matHeaderCellDef>#</th>
                <td mat-cell *matCellDef="let element; let i = index">
                  {{ i + 1 }}
                </td>
              </ng-container>

              <!-- TO -->
              <ng-container matColumnDef="to">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>To</th>
                <td mat-cell *matCellDef="let element">{{ element.to }}</td>
              </ng-container>

              <!-- SUBJECT -->
              <ng-container matColumnDef="subject">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                  Subject
                </th>
                <td mat-cell *matCellDef="let element">
                  {{ element.subject }}
                </td>
              </ng-container>

              <!-- DATE SENT -->
              <ng-container matColumnDef="dateSent">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                  Date Sent
                </th>
                <td mat-cell *matCellDef="let element">
                  {{ element.dateSent | date : "dd-MM-YYYY hh:mm a" }}
                </td>
              </ng-container>

              <!-- STATUS -->
              <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef>Status</th>
                <td mat-cell *matCellDef="let element">
                  <span
                    [ngClass]="{
                      'text-success': element.status === 'Sent',
                      'text-danger': element.status === 'Failed'
                    }"
                    >{{ element.status }}</span
                  >
                </td>
              </ng-container>

              <!-- ACTIONS -->
              <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let element" class="action-link">
                  <button
                    mat-icon-button
                    color="primary"
                    (click)="viewMail(element)"
                    class="action-btn"
                    matTooltip="Click to View"
                  >
                    <mat-icon>visibility</mat-icon>
                  </button>
                  &nbsp;&nbsp;
                  <button
                    mat-icon-button
                    color="accent"
                    (click)="resendMail(element)"
                    class="action-btn"
                    matTooltip="Click to resend E-mail"
                  >
                    <mat-icon>refresh</mat-icon>
                  </button>
                  <!-- <button mat-icon-button color="warn" (click)="deleteMail(element)">
              <mat-icon>delete</mat-icon>
            </button> -->
                </td>
              </ng-container>

              <!-- Header and Row Declarations -->
              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </table>

            <mat-paginator
              #paginator
              [pageSize]="pageSize"
              [pageSizeOptions]="[5, 10, 20]"
              [showFirstLastButtons]="true"
              [length]="totalSize"
              [pageIndex]="currentPage"
              (page)="handlePage($event)"
            >
            </mat-paginator>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
